name: Validate packages
on: [push, pull_request, workflow_dispatch]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install jsonschema
      - run: python tools/validate_package.py --schema
      - run: python -m unittest discover -s tests -v
      - run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/ugc-claude" @anthropic-ai/claude-code-linux-x64@2.1.299
      - run: '"$RUNNER_TEMP/ugc-claude/node_modules/@anthropic-ai/claude-code-linux-x64/claude" plugin validate .'
      - run: '"$RUNNER_TEMP/ugc-claude/node_modules/@anthropic-ai/claude-code-linux-x64/claude" plugin validate ./plugins/roblox-ugc'
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: roblox-ugc-packages
          path: dist/
